# ============================================================
# StockSense — Local Development Services
# ============================================================
# Usage:
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Logs:   docker compose logs -f postgres
#   Reset:  docker compose down -v  (WARNING: deletes all data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksense-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-stocksense}
    volumes:
      - stocksense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocksense}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stocksense_pgdata:
